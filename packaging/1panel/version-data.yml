        zh: PostgreSQL 连接串
        zh-Hant: PostgreSQL 連線字串
      required: true
      type: text
    - default: ""
      edit: true
      envKey: AUTH_SECRET
      labelEn: Auth Secret
      labelZh: 登录密钥
      label:
