additionalProperties:
  formFields:
    - default: 3100
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: Web Port
      labelZh: Web 访问端口
      label:
        en: Web Port
        zh: Web 访问端口
        zh-Hant: Web 存取連接埠
      required: true
      rule: paramPort
      type: number
    - default: 127.0.0.1
      edit: true
      envKey: PANEL_APP_BIND_IP
      labelEn: Host Bind IP (127.0.0.1 = localhost only, 0.0.0.0 = public)
      labelZh: 宿主机监听地址(127.0.0.1=仅本机,0.0.0.0=公网)
      label:
        en: Host Bind IP (127.0.0.1 = localhost only, 0.0.0.0 = public)
        zh: 宿主机监听地址(127.0.0.1=仅本机,0.0.0.0=公网)
        zh-Hant: 主機監聽位址(127.0.0.1=僅本機,0.0.0.0=公網)
      required: true
      type: text
    - default: https://registry.npmmirror.com
      edit: true
      envKey: NPM_REGISTRY
      labelEn: NPM Registry
      labelZh: NPM 镜像源
      label:
        en: NPM Registry
        zh: NPM 镜像源
        zh-Hant: NPM 鏡像源
      required: true
      type: text
    - default: Asia/Shanghai
      edit: true
      envKey: TZ
      labelEn: Container Timezone
      labelZh: 容器时区
      label:
        en: Container Timezone
        zh: 容器时区
        zh-Hant: 容器時區
      required: true
      type: text
    - default: Asia/Shanghai
      edit: true
      envKey: APP_TIME_ZONE
      labelEn: Display Timezone
      labelZh: 页面显示时区
      label:
        en: Display Timezone
        zh: 页面显示时区
        zh-Hant: 頁面顯示時區
      required: true
      type: text
    - default: moyuhai223/ai-image-web-studio
      edit: true
      envKey: GITHUB_REPOSITORY_SLUG
      labelEn: GitHub Repository
      labelZh: GitHub 仓库
      label:
        en: GitHub Repository
        zh: GitHub 仓库
        zh-Hant: GitHub 倉庫
      required: true
      type: text
    - default: ""
      edit: true
      envKey: DATABASE_URL
      labelEn: PostgreSQL Connection URL
      labelZh: PostgreSQL 连接串
      label:
