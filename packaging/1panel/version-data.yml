        zh: 登录密钥
        zh-Hant: 登入密鑰
      required: true
      random: true
      rule: paramComplexity
      type: password
    - default: ""
      edit: true
      envKey: PROVIDER_BASE_URL
      labelEn: Provider Base URL
      labelZh: Provider 地址
      label:
        en: Provider Base URL
        zh: Provider 地址
        zh-Hant: Provider 位址
      required: true
      type: text
    - default: ""
      edit: true
      envKey: PROVIDER_API_KEY
      labelEn: Default API Key
      labelZh: 默认 API Key
      label:
        en: Default API Key
        zh: 默认 API Key
        zh-Hant: 預設 API Key
      required: true
      type: password
    - default: gpt-image-2
      edit: true
      envKey: IMAGE_MODEL_GPT
      labelEn: GPT Image Model
      labelZh: GPT 图片模型
      label:
        en: GPT Image Model
        zh: GPT 图片模型
        zh-Hant: GPT 圖片模型
      required: true
      type: text
    - default: Nano Banana 2
      edit: true
      envKey: IMAGE_MODEL_NANO_BANANA
