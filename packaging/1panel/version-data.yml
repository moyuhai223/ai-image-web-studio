        zh: Gemini 图片模型
        zh-Hant: Gemini 圖片模型
      required: true
      type: text
    - default: 20
      edit: true
      envKey: MAX_UPLOAD_MB
      labelEn: Max Upload MB
      labelZh: 最大上传 MB
      label:
        en: Max Upload MB
        zh: 最大上传 MB
        zh-Hant: 最大上傳 MB
      required: true
      type: number
    - default: 20
      edit: true
      envKey: MAX_GENERATION_QUEUE_SIZE
      labelEn: Queue Size
      labelZh: 队列最大数量
      label:
        en: Queue Size
        zh: 队列最大数量
        zh-Hant: 佇列最大數量
      required: true
      type: number
    - default: 900000
      edit: true
      envKey: GENERATION_TIMEOUT_MS
      labelEn: Generation Timeout MS
      labelZh: 生成超时毫秒
      label:
        en: Generation Timeout MS
        zh: 生成超时毫秒
        zh-Hant: 生成逾時毫秒
      required: true
      type: number
    - default: admin
      edit: true
      envKey: ADMIN_USERNAME
      labelEn: Initial Admin Username
      labelZh: 初始管理员账号
      label:
        en: Initial Admin Username
        zh: 初始管理员账号
        zh-Hant: 初始管理員帳號
      required: true
      type: text
    - default: ""
      edit: true
      envKey: ADMIN_PASSWORD
      labelEn: Initial Admin Password (blank = admin/admin)
      labelZh: 初始管理员密码(留空=admin/admin,首次登录强制改密)
      label:
        en: Initial Admin Password (blank = admin/admin, forced change on first login)
        zh: 初始管理员密码(留空=admin/admin,首次登录强制改密)
        zh-Hant: 初始管理員密碼(留空=admin/admin,首次登入強制改密)
      required: false
      type: password
