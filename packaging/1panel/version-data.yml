      label:
        en: Nano Banana Model
        zh: Nano Banana 模型
        zh-Hant: Nano Banana 模型
      required: true
      type: text
    - default: gemini-3.1-flash-image
      edit: true
      envKey: IMAGE_MODEL_GEMINI
      labelEn: Gemini Image Model
      labelZh: Gemini 图片模型
      label:
